<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ASLG | مجموعة السيف القانونية</title>
<meta name="application-name" content="ASLG" />
<meta name="theme-color" content="#12315a" />
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
<link rel="manifest" href="/assets/site.webmanifest" />
<link rel="stylesheet" href="/_shared/fontawesome/7.3.1/css/all.min.css" />
<!-- Preloaded so the login screen paints its photograph in the same frame as
     the card, instead of flashing the fallback gradient first. Declared here
     rather than relying on CSS discovery because a background-image inside
     styles.css is only fetched after the stylesheet parses AND the element
     matches — two round-trips later than this. `fetchpriority="high"` keeps
     it ahead of the icon font, which the login screen doesn't need first.
     Harmless on every other page: the file is already cached by then, and a
     preload that goes unused costs one cached request, not a broken layout. -->
<link rel="preload" as="image" href="/assets/background.jpg" fetchpriority="high" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app-root"></div>
<div class="toast-container" id="toast-container"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>

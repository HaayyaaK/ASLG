<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ASLG | مجموعة السيف القانونية</title>
<meta name="application-name" content="ASLG" />
<meta name="theme-color" content="#12315a" />
<link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
<link rel="manifest" href="/assets/site.webmanifest" />
<!-- Login background preload, only when the login screen is what will render.
     A static <link rel="preload"> here made every signed-in page log
     "preloaded but not used"; injecting it from js/pages/login.js fixed that
     but came too late to help (after the app's modules load). This runs
     during HTML parse, before the stylesheet and app bundle, so the photo
     starts downloading immediately for the login page's first paint. The
     test mirrors js/api.js's session: signed in == "aslg_session" present.
     app.js::renderShell removes the tag once the shell renders. -->
<script>
  try {
    if (!sessionStorage.getItem("aslg_session")) {
      var bgPreload = document.createElement("link");
      bgPreload.id = "login-bg-preload";
      bgPreload.rel = "preload";
      bgPreload.as = "image";
      bgPreload.href = "/assets/background.jpg";
      bgPreload.setAttribute("fetchpriority", "high");
      document.head.appendChild(bgPreload);
    }
  } catch (e) {
    /* storage unavailable: skip the hint; the login page still works */
  }
</script>
<!-- Stylesheets AFTER the script above, deliberately: a browser holds an
     inline script until every stylesheet above it has loaded, which delayed
     the preload by the icon-font CSS's whole download. Stylesheet order is
     unchanged (icons, then the app's own). -->
<link rel="stylesheet" href="/_shared/fontawesome/7.3.1/css/all.min.css" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app-root"></div>
<div class="toast-container" id="toast-container"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
